name: Release

# Every push to main is a release of the version in pyproject.toml:
#   CI (incl. the package build) -> fail if v<version> already exists
#   -> PyPI -> BSR -> tag v<version> + GitHub release (CHANGELOG.md section as notes).
# A push to main without a new version therefore fails. Bump the version and
# add a dated CHANGELOG.md section in the same change.
#
# The tag is created last, so it marks a complete release. If a run fails after
# the PyPI upload, rerun it: existing PyPI files are skipped.
#
# One-time setup:
#   - PyPI: trusted publisher for this repo, workflow "release.yml", environment "pypi".
#   - BSR:  `name:` in proto/buf.yaml and repository secret BUF_TOKEN (skipped until then).

on:
  push:
    branches: [main]
  workflow_dispatch: # e.g. to retry after setting up the PyPI trusted publisher

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check:
    name: Version not released yet
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.exists.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # upstream has no floating major tag
      - id: version
        run: echo "version=$(uv version --short)" | tee -a "$GITHUB_OUTPUT"
      - id: exists
        name: Fail if v<version> already exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 -I scripts/ci/release_check.py "$VERSION"
      - name: CHANGELOG.md has a dated section for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -I scripts/ci/changelog.py release "$VERSION"
          python3 -I scripts/ci/changelog.py notes "$VERSION" > release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [ci, check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/protoc-gen-fory/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: CI built the same version
        env:
          BUILT: ${{ needs.ci.outputs.version }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          [[ "$BUILT" == "$VERSION" ]] || { echo "::error::CI built $BUILT, release is $VERSION"; exit 1; }
      # The wheel and sdist that CI built and smoke-tested.
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/
      - uses: astral-sh/setup-uv@v10.4.0 # upstream has no floating major tag
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  bsr:
    name: Push fory-options to the BSR
    needs: [ci, check]
    runs-on: ubuntu-latest
    environment: bsr
    steps:
      - uses: actions/checkout@v7
      - id: module
        run: |
          if grep -Eq '^name:' proto/buf.yaml; then
            echo "named=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::proto/buf.yaml has no 'name:' yet; skipping buf push"
            echo "named=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.module.outputs.named == 'true'
        uses: bufbuild/buf-action@v1
        with:
          input: proto
          token: ${{ secrets.BUF_TOKEN }}
          lint: false
          format: false
          breaking: false
          push: true
          pr_comment: false

  github-release:
    name: Tag and GitHub release
    needs: [check, pypi, bsr]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.check.outputs.version }}
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md "${flags[@]}"
