// Copied from apache/fory integration_tests/idl_tests/idl. The int8/int16/uint8/uint16
// fields are removed: they exist only in foryc's proto dialect, not in protobuf.
syntax = "proto3";

package complex_pb;
import "fory/options.proto";

option go_package = "github.com/apache/fory/integration_tests/idl_tests/go/complex_pb/generated;complex_pb";

message PrimitiveTypes {
  option (fory.message).id = 200;

  bool bool_value = 1;
  sfixed32 int32_value = 4;
  sint32 varint_i32_value = 5;
  sfixed64 int64_value = 6;
  sint64 varint_i64_value = 7;
  int64 tagged_i64_value = 8 [ (fory.field).type = "tagged int64" ];
  fixed32 uint32_value = 11;
  uint32 varint_u32_value = 12;
  fixed64 uint64_value = 13;
  uint64 varint_u64_value = 14;
  uint64 tagged_u64_value = 15 [ (fory.field).type = "tagged uint64" ];
  float float32_value = 17;
  double float64_value = 18;

  oneof Contact {
    string email = 19;
    int32 phone = 20;
  }
}
